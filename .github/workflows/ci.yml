name: CI

on:
  push:
    branches: [main]
  # No base-branch filter — CI runs on every PR, including stacked ones
  # whose base is another feature branch. Without this, stacked PRs show
  # zero checks until they're retargeted to main.
  #
  # `ready_for_review` is added explicitly: GitHub's default pull_request
  # types are [opened, synchronize, reopened] — flipping a draft to
  # ready does NOT trigger CI without this. fix-bot opens PRs as drafts;
  # this ensures CI fires when they're flipped.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.ref }}
  # Cancel older runs on PR branches only. On main, a run in progress
  # finishes — cancelling mid-flight could leave a push unvalidated
  # and races with deploy/publish workflows that trust CI. GitHub still
  # replaces a main run that is waiting when a newer push queues, so
  # merges in quick succession share one run on the newest commit.
  # A main run in progress therefore holds the group, so every job sets
  # `timeout-minutes`: GitHub's default is 6 hours, and on 2026-10-22 two
  # jobs stuck in apt-get (#368) kept main's CI waiting for five hours.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # biome format --check on every file. Fails with diff output if any
      # file would be reformatted; run `npm run format` locally to fix.
      - run: npm run format:check

  # packages/gazetta's tests, split by file across three runners. Each
  # shard writes a blob report; the `test` job below merges them into one
  # result and one coverage table.
  test-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w packages/gazetta
      # With coverage, as a report only: the table goes in the job summary
      # and nothing fails on a percentage (rule 31; mutation testing judges
      # test quality).
      - run: npm run test:coverage -w packages/gazetta -- --shard=${{ matrix.shard }}/3 --reporter=default --reporter=blob --outputFile.blob=.vitest/blob/shard-${{ matrix.shard }}.json
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vitest-blob-shard-${{ matrix.shard }}
          path: packages/gazetta/.vitest/blob/
          include-hidden-files: true
          retention-days: 1
      # Render gazetta.studio, so a change that breaks the real site fails
      # here instead of in the production deploy. Filesystem `ci` target
      # only (publishing into `local`, the editing source, is refused, #1526). No secrets are referenced: the R2 values are placeholders (the
      # site config builds its R2 client at load), so even a mistaken
      # `publish production` could not authenticate. Production publishes
      # only from deploy-site.yml on main. One shard is enough.
      - name: Publish gazetta.studio to its ci target
        if: matrix.shard == 1
        run: npx tsx packages/gazetta/src/cli/index.ts publish ci sites/gazetta.studio --force
        env:
          R2_ACCESS_KEY_ID: ci-placeholder
          R2_SECRET_ACCESS_KEY: ci-placeholder

  # Keeps the name `test`, which branch protection requires. It fails when
  # any shard failed: a skipped required check would count as passing.
  test:
    needs: test-shard
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Shards passed
        env:
          SHARDS: ${{ needs.test-shard.result }}
        run: |
          echo "test-shard: $SHARDS"
          [ "$SHARDS" = success ]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ !cancelled() }}
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ !cancelled() }}
        with:
          node-version: 22
          cache: npm
      - if: ${{ !cancelled() }}
        run: npm ci
      - if: ${{ !cancelled() }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: vitest-blob-shard-*
          path: packages/gazetta/.vitest/blob
          merge-multiple: true
      # Merges the shards' results and coverage; fails if any test failed.
      - if: ${{ !cancelled() }}
        run: npm run test:coverage -w packages/gazetta -- --merge-reports=.vitest/blob
      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: node scripts/coverage-summary.mjs packages/gazetta/coverage/coverage-summary.json 'packages/gazetta coverage' >> "$GITHUB_STEP_SUMMARY"

  admin:
    # Vue Test Utils + jsdom tests for apps/admin. The trophy/honeycomb
    # tier per testing-plan.md and the load-bearing gate for Vue
    # component + admin-API behavior. Requires the gazetta package to
    # be built first because tests/sw-build.test.ts invokes the admin
    # Vite build, which imports `gazetta/types` etc. via the package's
    # exports map (resolved against packages/gazetta/dist).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w packages/gazetta
      # vue-tsc, not tsc: it also checks .vue files. Needs the gazetta
      # build above (the admin imports its types from dist).
      - name: Type-check
        run: npm run typecheck -w apps/admin
      # Pre-pull the testcontainers images BEFORE the tests run.
      # tests/docker.test.ts brings up MinIO + Azurite via testcontainers,
      # whose default pull policy is pull-if-absent — so once these images
      # are local, `.up()` performs no pull at test time.
      #
      # `minio/minio` is gated behind auth on BOTH Docker Hub and quay.io.
      # We pull Bitnami's published MinIO (`bitnamilegacy/minio`, verified
      # anonymously pullable) instead — see docker-compose.yml for the full
      # rationale. The retry loop is defense against GENUINE transient
      # network blips.
      #
      # Image refs MUST match docker-compose.yml verbatim so the pulled
      # images satisfy testcontainers' pull-if-absent check.
      - name: Pre-pull testcontainers images (retry)
        run: |
          for image in mcr.microsoft.com/azure-storage/azurite:3.37.0 bitnamilegacy/minio:latest; do
            for attempt in 1 2 3; do
              # Capture docker's stderr so a real failure cause (unauthorized,
              # manifest-unknown, TLS, rate-limit) surfaces in the log instead
              # of being masked behind a generic "failed (attempt N/3)". The
              # #811 regression was invisible for a cycle because the prior
              # loop swallowed the `unauthorized: ...` line.
              if err=$(docker pull "$image" 2>&1); then
                echo "$err"
                break
              fi
              echo "$err"
              if [ "$attempt" -eq 3 ]; then
                echo "::error::failed to pull $image after 3 attempts (see docker error above)"
                exit 1
              fi
              echo "pull of $image failed (attempt $attempt/3); retrying in $((attempt * 5))s"
              sleep $((attempt * 5))
            done
          done
      - run: npm run test:coverage -w @gazetta/admin
      - name: Coverage summary
        if: always()
        run: node scripts/coverage-summary.mjs apps/admin/coverage/coverage-summary.json 'apps/admin coverage' >> "$GITHUB_STEP_SUMMARY"

  bots:
    # Pure-logic tests for the bots workspace (Stryker report parser,
    # fix-bot's failure-diagnostic + issue-shape helpers). Fast (~150ms)
    # and infrastructure-free — no testcontainers, no Playwright, no
    # workspace build needed. Gates only the bots/ tree, but runs on
    # every PR because changes to `bots/_lib/*` affect every bot.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -w @gazetta/bots

  storybook:
    # Story render gate (#524, ADR-0016): every admin `.stories.ts` runs as a
    # vitest browser test via @storybook/addon-vitest. A story that throws on
    # render, or whose `play` function fails, fails this job. The
    # review-workflow UX cuts are built to green stories against it.
    # gazetta is built first because admin components import `gazetta/*`
    # through the package's exports map (resolved against dist), as in the
    # admin job.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w packages/gazetta
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browsers
        run: npx playwright install chromium
      - run: npm run test:storybook

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w packages/gazetta

      # Cache Playwright browsers keyed by lockfile — version bumps
      # invalidate automatically. No `--with-deps`: the runner image already
      # has Chromium's system libraries, and installing them through apt
      # sometimes waited 5-10 min on a throttled Ubuntu mirror. If the image
      # ever drops one, Chromium fails to start and names it.
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browsers
        run: npx playwright install chromium

      - run: npx playwright test --project=dev --shard=${{ matrix.shard }}/7

      - name: Upload test-results on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-test-results-shard-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  # The Playwright projects that run against production builds: the built
  # admin (incl. its service worker and offline reload), static and ESI
  # targets, and the target matrix. The e2e job above runs `dev` only, and
  # dev mode has no service worker.
  e2e-prod:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w packages/gazetta
      - run: npm run build:admin -w packages/gazetta
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browsers
        run: npx playwright install chromium
      - run: npx playwright test --project=prod-admin --project=prod-static --project=prod-esi --project=matrix
      - name: Upload test-results on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-test-results-prod
          path: test-results/
          retention-days: 7

  # Pack once on linux — tarball is platform-independent.
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w packages/gazetta
      - run: npm run build:admin -w packages/gazetta
      - id: pack
        working-directory: packages/gazetta
        run: |
          tarball=$(npm pack --silent | tail -1)
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gazetta-tarball
          path: packages/gazetta/${{ steps.pack.outputs.tarball }}
          retention-days: 1

  # Consume the packed tarball on each OS. The pack/install/dev path is what
  # end users experience — this is where platform-specific issues surface.
  smoke:
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        # Windows smoke runs on main-only. PRs get Ubuntu + macOS for faster
        # feedback; Windows catches path/shell regressions post-merge, before
        # any tag is cut. Branch protection + linear history keeps the chain
        # honest — a tag always points at a SHA that cleared all three.
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest","macos-latest"]') || fromJSON('["ubuntu-latest","macos-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gazetta-tarball
          path: packages/gazetta/
      - name: Smoke test (init → dev → curl)
        shell: bash
        run: |
          # Find the downloaded tarball
          TARBALL="$(find packages/gazetta -maxdepth 1 -name 'gazetta-*.tgz' | head -1)"
          GAZETTA_TARBALL="$(pwd)/$TARBALL" npm run smoke

  # Node 26, the Active LTS line from 2026-10-28 (nodejs/Release
  # schedule.json), which nodejs.org offers new users. Every other job runs
  # on 22. This one runs what a newcomer meets (the packed tarball through
  # init → dev → curl) and packages/gazetta's tests, on Ubuntu only. Not a
  # required check yet; add it to branch protection once it has proved
  # stable. A separate job, because a node dimension on `smoke`'s matrix
  # would rename its required checks.
  node-26:
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run build -w packages/gazetta
      - run: npm test -w packages/gazetta
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gazetta-tarball
          path: packages/gazetta/
      - name: Smoke test (init → dev → curl)
        shell: bash
        run: |
          TARBALL="$(find packages/gazetta -maxdepth 1 -name 'gazetta-*.tgz' | head -1)"
          GAZETTA_TARBALL="$(pwd)/$TARBALL" npm run smoke
