name: Mutation watcher

# Review of Stryker mutation results. Pairs with the Mutation workflow
# (mutation.yml) — fires when Mutation completes successfully (any
# event, including manual workflow_dispatch). The previous cron-based
# trigger (`30 3 * * *`) raced with Stryker's variable runtime (~1-3h)
# AND GitHub Actions cron skew (scheduled runs can start hours late on
# free runners); the watcher consistently consumed yesterday's artifact
# instead of today's. workflow_run is event-driven, so the dependency
# is correct regardless of when Stryker actually finishes.
#
# Producer-bot pattern: self-classifies output as `bug` + `area: X` +
# `ready-for-agent`, bypassing triage-bot. Surviving mutants are
# self-validating gaps — they go straight to fix-bot's queue.
#
# This workflow's failure doesn't block anything (continue-on-error) —
# monitoring infrastructure, not a gate.
on:
  workflow_run:
    workflows: [Mutation]
    # Both success and failure: Stryker exits non-zero when the
    # mutation score breaks the threshold, but the HTML artifact is
    # still uploaded and worth analyzing. The bot's prompt handles
    # "no actionable mutants" gracefully when there's nothing to file.
    types: [completed]
  workflow_dispatch:
    # Manual trigger — useful for testing prompt changes against the
    # latest Mutation artifact without waiting for the next nightly run.

jobs:
  watch:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    permissions:
      # Read CI run history (download Mutation artifact) + read/write
      # issues. No code/contents access needed.
      actions: read
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install workspace deps
        run: npm ci

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run mutation watcher
        env:
          # Auth via Claude Code OAuth token — see flake-watcher.yml for
          # the same pattern.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Days within which a closed prior issue suppresses re-filing.
          # Beyond this window, the bot files a fresh issue referencing
          # the prior one. Prevents the bot from steady-stating on the
          # same top-N files forever after one fix cycle. Default 30d
          # matches the monthly compactor cadence — humans have a full
          # review cycle to react before the bot re-opens the surface.
          CLOSED_FOLLOWUP_WINDOW_DAYS: '30'
        run: npm run mutation-watcher -w @gazetta/bots

      # Per-investigation JSONL transcripts. A future agent can run
      # `gh run download <run-id> -n mutation-watcher-transcripts` to read
      # every tool call and decision from past runs.
      - name: Upload transcripts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-watcher-transcripts
          path: bots/transcripts/
          if-no-files-found: ignore
          retention-days: 90
