name: Deploy gazetta.studio

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'sites/gazetta.studio/**'
      - 'packages/gazetta/**'

# Serialize deploys. A half-published R2 is worse than a queued deploy,
# so never cancel one in progress.
concurrency:
  group: deploy-gazetta-studio
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    # Production publishes from main only. Without this, a manual
    # workflow_dispatch on any branch would publish that branch to R2.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build -w packages/gazetta

      - name: Publish site to R2
        run: npx tsx packages/gazetta/src/cli/index.ts publish production sites/gazetta.studio
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy worker
        working-directory: sites/gazetta.studio/worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # Nothing else checks the live site after a deploy. Fetch a few pages
      # through the worker (the query string misses the edge cache) and fail
      # the run if one doesn't render. /docs has code blocks, so it also
      # checks the shiki highlighter and R2's published fragments.
      - name: Check the live site
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          check() {
            local path=$1 want=$2 grep_for=$3
            for attempt in 1 2 3 4 5 6; do
              # A fresh query value per attempt, so a retry never gets a
              # response cached by an earlier one.
              # --max-time: a stalled request must not hang the job. A
              # transfer that fails part-way (curl exits non-zero) is a retry,
              # even if the status and the marker already arrived.
              if ! status=$(curl -s --max-time 20 -o page.html -w '%{http_code}' "https://gazetta.studio${path}?deploy-check=${RUN_ID}-${RUN_ATTEMPT}-${attempt}"); then
                status="curl error"
              fi
              if [ "$status" = "$want" ] && { [ -z "$grep_for" ] || grep -q "$grep_for" page.html; }; then
                echo "ok   ${path} -> ${status}"
                return 0
              fi
              echo "wait ${path} -> ${status} (attempt ${attempt})"
              sleep 10
            done
            local expected="$want"
            [ -n "$grep_for" ] && expected="$want containing $grep_for"
            echo "::error::${path} returned ${status}, expected ${expected}"
            return 1
          }
          failed=0
          check / 200 '<title>' || failed=1
          check /docs 200 'class="shiki' || failed=1
          check /deploy-check-missing-page 404 '' || failed=1
          exit $failed
