# Runs one e2e spec several times on CI, to check a flake fix before
# merging it (team-preferences rule 35). Start it on the fix's branch:
#
#   gh workflow run e2e-repeat.yml --ref <branch> -f spec=tests/e2e/<name>.spec.ts
#
# The steps match ci.yml's e2e job: same setup, one worker. The spec runs
# alone, without the other tests of its CI shard.
name: e2e repeat

on:
  workflow_dispatch:
    inputs:
      spec:
        description: Spec file, e.g. tests/e2e/deep-linking.spec.ts
        required: true
        type: string
      grep:
        description: Only the tests whose title matches (Playwright -g). Empty runs every test in the file.
        required: false
        type: string
        default: ''
      repeat:
        description: Runs of each test (--repeat-each)
        required: false
        type: number
        default: 5

permissions:
  contents: read

jobs:
  repeat:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w packages/gazetta

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run the spec repeatedly
        env:
          SPEC: ${{ inputs.spec }}
          GREP: ${{ inputs.grep }}
          REPEAT: ${{ inputs.repeat }}
        run: |
          case "$SPEC" in
            tests/e2e/*.spec.ts | tests/e2e/*.test.ts) ;;
            *) echo "::error::spec must be a test file under tests/e2e/, got '$SPEC'"; exit 1 ;;
          esac
          if [ ! -f "$SPEC" ]; then echo "::error::$SPEC doesn't exist on this branch"; exit 1; fi
          case "$REPEAT" in
            '' | *[!0-9]* | 0*) echo "::error::repeat must be a whole number from 1, got '$REPEAT'"; exit 1 ;;
          esac
          args=(--project=dev "$SPEC" --repeat-each="$REPEAT")
          if [ -n "$GREP" ]; then args+=(-g "$GREP"); fi
          npx playwright test "${args[@]}"

      - name: Upload test-results on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-test-results-repeat
          path: test-results/
          retention-days: 7
