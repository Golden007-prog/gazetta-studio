name: Night shift

# Runs the heavy Claude bots one at a time, at night, in priority order.
# They share one Claude subscription with the maintainer's own sessions,
# PR reviews and autonomous runs, so one chain runs them in sequence and
# checks the account's usage before each.
#
# Every night: cut-planner files the next cut of each feature whose last
# cut merged that day (up to 4 runs, one action each), feature-bot
# implements the ready cuts, then fix-bot. Thursday adds
# dead-code-watcher, Sunday and Tuesday add review-bot, and the first
# Sunday of the month adds the compactors. Bot PRs are reviewed daily,
# so a merged cut gets its successor implemented the same night.
#
# GitHub starts scheduled runs late: the 20:37 UTC schedule lands around
# 23:00-01:00 UTC, sometimes later. The 21:37 schedule is a backup for
# the nights GitHub drops a scheduled run; whichever starts second sees
# that the other already ran the night's lineup and skips.
#
# Before each bot, a one-line Haiku call reports the account's 5-hour
# and 7-day usage (`rate_limit_event` in stream-json). The chain stops
# there when the week is ahead of pace: the bots may take the week's
# usage up to PACE_START + PACE_PER_DAY for each day since the weekly
# reset, and never past BOT_WEEK_CAP. Above the cap, 70-80% is kept for
# PR reviews and autonomous runs (external contributors first), and the
# last 20% for the maintainer's other work. Bots after the first also
# stop when the 5-hour window is at 80%.

on:
  schedule:
    - cron: '37 20 * * *'
    - cron: '37 21 * * *' # backup for a dropped run
  workflow_dispatch:
    inputs:
      lineup:
        description: 'Space-separated bots to run in order, e.g. "fix-bot review-bot". Options: cut-planner feature-bot fix-bot review-bot dead-code-watcher bots-compact'
        required: true
      dry_run:
        description: 'Set to "1" to dispatch only bots that support dry_run (cut-planner, feature-bot, review-bot), in dry-run mode. Proves the chain without spending budget.'
        required: false
        default: ''

concurrency:
  # Primary and backup queue behind each other instead of overlapping.
  group: night-shift
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      lineup: ${{ steps.lineup.outputs.lineup }}
    steps:
      - id: lineup
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          INPUT_LINEUP: ${{ inputs.lineup }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = workflow_dispatch ]; then
            echo "lineup=$INPUT_LINEUP" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Skip if the other schedule of this night already ran the chain.
          # Only scheduled runs count, so a manual dispatch never blocks a night.
          since=$(date -u -d '12 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          for id in $(gh run list --workflow night-shift.yml --event schedule --created ">=$since" --json databaseId --jq '.[].databaseId'); do
            [ "$id" = "$GITHUB_RUN_ID" ] && continue
            ran=$(gh run view "$id" --json jobs --jq '[.jobs[] | select(.name == "chain" and .conclusion != "skipped" and .conclusion != "cancelled")] | length')
            if [ "$ran" != 0 ]; then
              echo "::notice::Run $id already ran tonight's lineup; skipping."
              echo "lineup=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          # The run starts hours after the schedule, so date the night, not
          # the start time.
          night=$(date -u -d '12 hours ago')
          day=$(date -u -d "$night" +%u) # 1 = Monday ... 7 = Sunday
          lineup='cut-planner feature-bot fix-bot'
          case "$day" in
            4) lineup="$lineup dead-code-watcher" ;;
            2|7) lineup="$lineup review-bot" ;;
          esac
          # Compactors on the first Sunday night of the month.
          if [ "$day" = 7 ] && [ "$(date -u -d "$night" +%-d)" -le 7 ]; then
            lineup="$lineup bots-compact"
          fi
          echo "lineup=$lineup" >> "$GITHUB_OUTPUT"
          echo "Tonight: $lineup"

  chain:
    needs: plan
    if: needs.plan.outputs.lineup != ''
    runs-on: ubuntu-latest
    # GitHub's maximum for a job on its hosted runners. feature-bot can take
    # 180 min and fix-bot 120; on a typical night the pace check stops the
    # chain, or the lineup finishes, well before this.
    timeout-minutes: 360
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      LINEUP: ${{ needs.plan.outputs.lineup }}
      DRY_RUN: ${{ inputs.dry_run }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      # The week's pace for the bots, as shares of the weekly limit.
      PACE_START: '0.20'
      PACE_PER_DAY: '0.10'
      BOT_WEEK_CAP: '0.70'
    steps:
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@stable

      - name: Run the lineup
        run: |
          set -uo pipefail

          # Prints "<five_hour> <seven_day> <status> <seven_day_resets_at>"
          # from a one-line Haiku call. Empty output means the CLI reported
          # no usage; treated as unknown.
          probe() {
            claude -p 'Reply with OK.' --model haiku --output-format stream-json --verbose 2>/dev/null \
              | jq -r 'select(.type == "rate_limit_event") | .rate_limit_info
                       | "\(.unifiedWindows.five_hour.utilization // 0) \(.unifiedWindows.seven_day.utilization // 0) \(.status) \(.unifiedWindows.seven_day.resetsAt // "")"' \
              | tail -1
          }

          # Prints "<line> paced": the share of the week the bots may have
          # used by now, given the next weekly reset in epoch seconds (as
          # the CLI reports it). A reset time that isn't a number within the
          # next 8 days (missing, or a changed format or unit) can't be paced
          # against: it prints "<cap> unpaced", and the caller warns.
          pace() {
            awk -v reset="${1:-}" -v now="$(date +%s)" -v start="$PACE_START" -v per_day="$PACE_PER_DAY" -v cap="$BOT_WEEK_CAP" 'BEGIN {
              left = reset - now
              if (reset !~ /^[0-9]+$/ || left <= 0 || left > 8 * 86400) { printf "%.2f unpaced", cap; exit }
              line = start + per_day * (7 - left / 86400)
              if (line < start) line = start
              if (line > cap) line = cap
              printf "%.2f paced", line
            }'
          }

          # Dispatches one run of a bot and waits for it to finish. Sets $id.
          run_bot() {
            local bot=$1
            shift
            local started
            started=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            gh workflow run "$bot.yml" --ref "$GITHUB_REF_NAME" "$@"
            id=''
            for _ in $(seq 1 30); do
              id=$(gh run list --workflow "$bot.yml" --event workflow_dispatch --created ">=$started" \
                     --json databaseId --jq '.[0].databaseId // empty')
              [ -n "$id" ] && break
              sleep 10
            done
            if [ -z "$id" ]; then
              echo "::error::Dispatched $bot but its run never appeared; stopping."
              exit 1
            fi
            echo "$bot: https://github.com/$GH_REPO/actions/runs/$id"
            # A failed bot run doesn't stop the chain; each bot reports its
            # own failures. Only the usage checks do.
            gh run watch "$id" --interval 60 > /dev/null || echo "::warning::$bot run $id did not succeed"
            echo "$bot finished: $(gh run view "$id" --json conclusion --jq .conclusion)"
          }

          first=1
          for bot in $LINEUP; do
            # cut-planner takes one action per run (design-cut-planner.md
            # Q5a), so it runs once per planner, until a run takes none.
            runs=1
            [ "$bot" = cut-planner ] && runs=4
            for _ in $(seq 1 "$runs"); do
              read -r five seven status reset <<< "$(probe)"
              read -r line paced <<< "$(pace "${reset:-}")"
              echo "Before $bot: five_hour=${five:-?} seven_day=${seven:-?} status=${status:-?} pace=$line"
              if [ -n "${seven:-}" ] && [ "$paced" = unpaced ]; then
                echo "::warning::The CLI reported no usable weekly reset time (${reset:-none}); only the $BOT_WEEK_CAP cap applies before $bot."
              fi
              if [ "${status:-}" = rejected ]; then
                echo "::warning::Quota exhausted before $bot; stopping the chain."
                break 2
              fi
              if [ -n "${seven:-}" ] && awk -v s="$seven" -v l="$line" 'BEGIN { exit !(s >= l) }'; then
                echo "::warning::The week is ahead of pace before $bot (7d $seven, pace $line); stopping the chain."
                break 2
              fi
              # Later bots also need room in the 5-hour window, so one bot's
              # run doesn't use the night up.
              if [ "$first" = 0 ] && [ -n "${five:-}" ] && awk -v f="$five" 'BEGIN { exit !(f >= 0.8) }'; then
                echo "::warning::5-hour usage high before $bot ($five); stopping the chain."
                break 2
              fi
              first=0

              args=()
              case "$bot" in
                cut-planner|feature-bot|review-bot) [ -n "$DRY_RUN" ] && args=(-f dry_run=1) ;;
                *) if [ -n "$DRY_RUN" ]; then echo "Skipping $bot (no dry_run)"; continue 2; fi ;;
              esac
              [ "$bot" = bots-compact ] && args+=(-f target=all)

              run_bot "$bot" "${args[@]}"
              # A cut-planner run that took no action means no planner has
              # one left tonight. The log is read in full before matching:
              # piped into `grep -q`, gh can die of SIGPIPE when grep stops
              # reading, and pipefail would then read a match as a miss.
              if [ "$bot" = cut-planner ]; then
                log=$(gh run view "$id" --log 2>/dev/null) || log=''
                [[ "$log" == *'One action taken'* ]] || break
              fi
            done
          done
