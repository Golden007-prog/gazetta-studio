name: Dead code watcher

# Weekly scan for dead code (knip findings older than 30 days). Files
# delete-PRs directly when safe; opens skip-list-entry PRs when
# uncertain. Composes with the monthly compaction workflow.
#
# Different from other producer bots (flake-watcher, mutation-watcher):
# does NOT delegate to fix-bot. The "TDD-first" contract that fix-bot
# enforces doesn't compose well with code deletion — the verification
# is "existing tests pass," not "a new failing test passes."
on:
  # No schedule of its own: night-shift.yml starts it on Thursday nights, one bot at
  # a time, after checking the Claude quota.
  workflow_dispatch:
    # Manual trigger for testing or backfill after prompt iteration.
    inputs:
      min_stable_days:
        description: 'Override MIN_STABLE_DAYS (default 14). Lower values let the bot act on more recent findings.'
        required: false
        default: '14'
      max_attempts:
        description: 'Override MAX_ATTEMPTS for the reviewer loop (default 5).'
        required: false
        default: '5'
      per_run_finding_cap:
        description: 'Override PER_RUN_FINDING_CAP (default 3).'
        required: false
        default: '3'

# Single-instance invariant for cache safety. The bot appends to a
# cached reviewer-log.jsonl; two concurrent runs would race on the
# cache (last-writer-wins would lose entries). `cancel-in-progress:
# false` queues the second invocation until the first completes —
# never kills in-flight work. The group name is the literal
# 'dead-code-watcher' (not ${{ github.workflow }}) so the monthly
# compactor's matching job in bots-compact.yml shares the same
# concurrency group across workflows.
concurrency:
  group: dead-code-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 60
    permissions:
      # Read CI run history (for past-PR feedback loop), read+write
      # issues (skip-list comments), read+write PRs (open delete-PRs +
      # skip-list-entry PRs), read+write contents (push branches).
      actions: read
      issues: write
      pull-requests: write
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # need git log for last-modified computation

      - name: Configure git author
        run: |
          git config user.name 'dead-code-watcher'
          git config user.email 'noreply@anthropic.com'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install workspace deps
        run: npm ci

      - name: Build gazetta package
        # Some workspaces need the built package for type-checks during
        # test runs (the bot validates deletions before pushing).
        run: npm run build -w packages/gazetta

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@stable

      # Restore the reviewer-log from cache. The bot appends Agent B
      # verdicts here on every loop iteration; the cache keeps the file
      # across runs so the monthly compactor has cross-run signal to
      # work with. See bots/README.md "Reviewer-log persistence" for
      # the design. Cache miss is fine — tailReviewerLog returns [].
      # Bump the -v1 suffix if the JSONL schema ever changes. The
      # restore + save pair (not the combined `actions/cache@vN`) is
      # load-bearing: the combined step skips its post-step save on a
      # cache HIT, breaking the append-write-back pattern. See #581.
      # Primary `key` uses ${{ github.run_id }} so exact-key match ALWAYS
      # misses at restore time — forcing fall-through to restore-keys.
      # The restore-keys prefix ends with '-' to disambiguate per-run
      # entries from any stale pre-#582 static blob. See #582 follow-up.
      - name: Restore reviewer-log cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bots/dead-code-watcher/reviewer-log.jsonl
          key: dead-code-watcher-reviewer-log-v1-${{ github.run_id }}
          restore-keys: |
            dead-code-watcher-reviewer-log-v1-

      - name: Run dead-code-watcher
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          # Optional overrides via workflow_dispatch inputs. The fallback
          # literals here MUST match the TypeScript defaults in
          # bots/dead-code-watcher/index.ts — when manual dispatch
          # provides no value, GH Actions evaluates `inputs.X` to ''
          # and the `||` selects the literal.
          MIN_STABLE_DAYS: ${{ inputs.min_stable_days || '14' }}
          MAX_ATTEMPTS: ${{ inputs.max_attempts || '5' }}
          PER_RUN_FINDING_CAP: ${{ inputs.per_run_finding_cap || '3' }}
        run: npm run dead-code-watcher -w @gazetta/bots

      # Save the appended reviewer-log under a per-run key. `if: always()`
      # ensures we persist verdicts even when the bot itself failed.
      # See #581.
      - name: Save reviewer-log cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bots/dead-code-watcher/reviewer-log.jsonl
          key: dead-code-watcher-reviewer-log-v1-${{ github.run_id }}

      - name: Upload transcripts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dead-code-watcher-transcripts
          path: bots/transcripts/
          if-no-files-found: ignore
          retention-days: 90
