name: Triage bot

# Daily autonomous first-pass triage of incoming issues. The bot enriches
# issues with classification (bug / enhancement), area labels, duplicate
# detection, and (for reproducible bugs) agent briefs — but NEVER advances
# state past `needs-triage`. State decisions stay with maintainers via the
# interactive `/triage` skill.
#
# Conventions match the /triage skill (~/.claude/skills/triage/) so bot output
# and human triage notes are interoperable.
#
# This workflow's failure doesn't block anything (continue-on-error) — it's
# monitoring infrastructure, not a gate.
on:
  schedule:
    # 03:00 UTC daily = 05:00 CEST / 04:00 CET. Runs after flake-watcher
    # (02:00 UTC) so today's flake-output is in place before triage-bot
    # scans — though producer-bot flake issues self-classify and bypass
    # triage anyway. Stays before discovery-prep + fix-bot (04:00 UTC)
    # so triage-bot's enhancement/bug classifications are visible when
    # those downstream bots pick up their inputs the same morning.
    - cron: '0 3 * * *'
  workflow_dispatch:
    # Manual trigger for testing prompt changes or one-off triage passes.
    # No inputs — bot's input is purely label-driven (open issues without
    # any classification or terminal-state label). To re-enqueue an
    # already-classified issue, manually remove the classification label
    # from it; next cron picks it up.

jobs:
  triage:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 60
    permissions:
      # Read code/contents (for repro), read+write issues (for labels +
      # comments). No write access to code; bot never commits.
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install workspace deps
        # Full install required because the bot may run actual tests as part
        # of bug reproduction. ~2 min cost amortized across the run.
        run: npm ci

      - name: Build gazetta package
        # Some tests need the built package; build once up front.
        run: npm run build -w packages/gazetta

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run triage bot
        env:
          # Auth via Claude Code OAuth token — same setup as flake-watcher.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: npm run triage-bot -w @gazetta/bots

      # Per-issue JSONL transcripts. Same loop as flake-watcher: a future
      # agent can `gh run download <run-id> -n triage-bot-transcripts` to
      # read every triage decision.
      - name: Upload transcripts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: triage-bot-transcripts
          path: bots/transcripts/
          if-no-files-found: ignore
          retention-days: 90

      # Test output the bot captured during bug reproduction. Investigation
      # notes link to these artifacts so maintainers can review the actual
      # output the bot saw without re-running the test. Bot writes to
      # bots/test-outputs/<issue-number>.txt per the prompt convention.
      - name: Upload test outputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: triage-bot-test-outputs
          path: bots/test-outputs/
          if-no-files-found: ignore
          retention-days: 90
