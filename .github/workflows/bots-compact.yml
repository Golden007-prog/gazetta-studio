name: Bots monthly compaction

# Monthly memory compaction for all memoryful bots. One workflow,
# one job per bot — each runs the bot's `:compact` script which reads
# the bot's skip-list and consolidates it (per-bot semantics differ).
#
# Replaces the prior dead-code-watcher-compact.yml; consolidated here
# so all compactors share one cron + one workflow_dispatch surface.
#
# Per-bot semantics:
#   - dead-code-watcher:compact — find ≥3 skip-list entries sharing
#     a pattern, replace with a glob rule.
#   - fix-bot:compact — rewrite lessons-learned.md from cross-issue
#     patterns in the skip-list (no glob rules; per-issue entries
#     stay durable).
#   - review-bot:compact — rewrite lessons-learned.md from cross-
#     candidate patterns in the skip-list + reviewer-log (no glob
#     rules; per-candidate entries stay durable).
#   - cut-planner:compact — rewrite lessons-learned.md from the
#     decision log (no skip-list; design-cut-planner.md Q7a).
on:
  # No schedule of its own: night-shift.yml starts it on the first Sunday night of the month, one bot at
  # a time, after checking the Claude quota.
  workflow_dispatch:
    # Manual trigger for testing or one-off compaction.
    inputs:
      target:
        description: 'Which compactor to run'
        type: choice
        options: [all, dead-code-watcher, fix-bot, review-bot, cut-planner]
        default: all

jobs:
  dead-code-watcher:
    # Run on cron OR when dispatch input is 'all' / 'dead-code-watcher'.
    if: github.event_name == 'schedule' || inputs.target == 'all' || inputs.target == 'dead-code-watcher'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    # Share concurrency group with the daily dead-code-watcher workflow.
    # The compactor reads AND truncates the reviewer-log (prunes to a
    # bounded window after producing the lessons rewrite); racing with
    # the daily bot would lose verdicts. Queue instead of cancel.
    concurrency:
      group: dead-code-watcher
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configure git author
        run: |
          git config user.name 'dead-code-watcher'
          git config user.email 'noreply@anthropic.com'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install workspace deps
        run: npm ci

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      # Restore/save SPLIT with per-run keys, matching the daily
      # dead-code-watcher workflow (#854). The daily bot saves under
      # `dead-code-watcher-reviewer-log-v1-<run_id>`; a static exact key with no
      # restore-keys never matches those entries, so the compactor used to
      # distil lessons from a stale log. Restore falls through restore-keys
      # (trailing dash, per #620) to the newest daily entry; the save below
      # writes the PRUNED log under a fresh per-run key, which the next
      # daily run's restore then picks up.
      - name: Restore reviewer-log cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bots/dead-code-watcher/reviewer-log.jsonl
          key: dead-code-watcher-reviewer-log-v1-${{ github.run_id }}
          restore-keys: |
            dead-code-watcher-reviewer-log-v1-

      - name: Run dead-code-watcher:compact
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: npm run dead-code-watcher:compact -w @gazetta/bots

      # if: always() — the compactor only prunes after Claude succeeds, so on
      # failure this re-saves the unchanged log; either way the next daily
      # run restores the latest state.
      - name: Save reviewer-log cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bots/dead-code-watcher/reviewer-log.jsonl
          key: dead-code-watcher-reviewer-log-v1-${{ github.run_id }}

      - name: Upload transcripts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dead-code-watcher-compact-transcripts
          path: bots/transcripts/
          if-no-files-found: ignore
          retention-days: 90

  fix-bot:
    if: github.event_name == 'schedule' || inputs.target == 'all' || inputs.target == 'fix-bot'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    # Share concurrency group with the daily fix-bot workflow. The
    # compactor reads AND truncates the reviewer-log; racing with
    # the daily bot would lose verdicts. Queue instead of cancel.
    concurrency:
      group: fix-bot
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configure git author
        run: |
          git config user.name 'fix-bot'
          git config user.email 'noreply@anthropic.com'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install workspace deps
        run: npm ci

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      # Restore/save SPLIT with per-run keys, matching the daily
      # fix-bot workflow (#854). The daily bot saves under
      # `fix-bot-reviewer-log-v1-<run_id>`; a static exact key with no
      # restore-keys never matches those entries, so the compactor used to
      # distil lessons from a stale log. Restore falls through restore-keys
      # (trailing dash, per #620) to the newest daily entry; the save below
      # writes the PRUNED log under a fresh per-run key, which the next
      # daily run's restore then picks up.
      - name: Restore reviewer-log cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bots/fix-bot/reviewer-log.jsonl
          key: fix-bot-reviewer-log-v1-${{ github.run_id }}
          restore-keys: |
            fix-bot-reviewer-log-v1-

      - name: Run fix-bot:compact
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: npm run fix-bot:compact -w @gazetta/bots

      # if: always() — the compactor only prunes after Claude succeeds, so on
      # failure this re-saves the unchanged log; either way the next daily
      # run restores the latest state.
      - name: Save reviewer-log cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bots/fix-bot/reviewer-log.jsonl
          key: fix-bot-reviewer-log-v1-${{ github.run_id }}

      - name: Upload transcripts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fix-bot-compact-transcripts
          path: bots/transcripts/
          if-no-files-found: ignore
          retention-days: 90

  review-bot:
    if: github.event_name == 'schedule' || inputs.target == 'all' || inputs.target == 'review-bot'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    # Share concurrency group with the daily review-bot workflow. The
    # compactor reads AND truncates the reviewer-log; racing with the
    # daily bot would lose verdicts. Queue instead of cancel.
    concurrency:
      group: review-bot
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configure git author
        run: |
          git config user.name 'review-bot'
          git config user.email 'noreply@anthropic.com'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install workspace deps
        run: npm ci

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      # Restore/save SPLIT with per-run keys, matching the daily
      # review-bot workflow (#854). The daily bot saves under
      # `review-bot-reviewer-log-v1-<run_id>`; a static exact key with no
      # restore-keys never matches those entries, so the compactor used to
      # distil lessons from a stale log. Restore falls through restore-keys
      # (trailing dash, per #620) to the newest daily entry; the save below
      # writes the PRUNED log under a fresh per-run key, which the next
      # daily run's restore then picks up.
      - name: Restore reviewer-log cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bots/review-bot/reviewer-log.jsonl
          key: review-bot-reviewer-log-v1-${{ github.run_id }}
          restore-keys: |
            review-bot-reviewer-log-v1-

      - name: Run review-bot:compact
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: npm run review-bot:compact -w @gazetta/bots

      # if: always() — the compactor only prunes after Claude succeeds, so on
      # failure this re-saves the unchanged log; either way the next daily
      # run restores the latest state.
      - name: Save reviewer-log cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bots/review-bot/reviewer-log.jsonl
          key: review-bot-reviewer-log-v1-${{ github.run_id }}

      - name: Upload transcripts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: review-bot-compact-transcripts
          path: bots/transcripts/
          if-no-files-found: ignore
          retention-days: 90

  cut-planner:
    if: github.event_name == 'schedule' || inputs.target == 'all' || inputs.target == 'cut-planner'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    permissions:
      # contents + pull-requests: the lessons rewrite lands as a PR.
      # issues: read — the prompt reads planner issues' decision comments.
      contents: write
      pull-requests: write
      issues: read
    # Shares the daily cut-planner's group: the compactor reads AND prunes the
    # decision log, so racing the daily run would lose entries.
    concurrency:
      group: cut-planner
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configure git author
        run: |
          git config user.name 'cut-planner'
          git config user.email 'noreply@anthropic.com'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install workspace deps
        run: npm ci

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      # Restore/save SPLIT with a per-run key, matching the daily
      # cut-planner workflow — same shape as every job above (#854). The
      # restore falls through `restore-keys` to the newest daily entry; the
      # save writes the pruned log under a fresh per-run key that the next
      # daily run's restore picks up.
      - name: Restore decision-log cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bots/cut-planner/decision-log.jsonl
          key: cut-planner-decision-log-v1-${{ github.run_id }}
          restore-keys: |
            cut-planner-decision-log-v1-

      - name: Run cut-planner:compact
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: npm run cut-planner:compact -w @gazetta/bots

      - name: Save decision-log cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bots/cut-planner/decision-log.jsonl
          key: cut-planner-decision-log-v1-${{ github.run_id }}

      - name: Upload transcripts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cut-planner-compact-transcripts
          path: bots/transcripts/
          if-no-files-found: ignore
          retention-days: 90
