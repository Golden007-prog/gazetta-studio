name: Publish to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          # No npm cache: a release build must not restore a cache that
          # other workflows can write (zizmor cache-poisoning). setup-node
          # caches automatically unless this is false.
          package-manager-cache: false

      - run: npm ci

      - run: npm run build -w packages/gazetta

      - run: npm run build:admin -w packages/gazetta

      # CI already ran tests + smoke on the PR whose squash/rebase produced
      # this tag commit — branch protection requires linear history, so the
      # tagged SHA is the validated SHA. Publish proceeds directly.

      - run: npm publish -w packages/gazetta --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
