name: Review bot

# Autonomous code-improvement producer per design-code-review.md "Review-bot
# (autonomous)". Daily cron picks an area, runs audit-area discovery, picks
# the top candidate, Agent A implements + tests, Agent B reviews the diff,
# orchestrator opens a PR on APPROVE.
#
# Status: SCAFFOLDING ONLY at first ship (P4 Cut 17). The pipeline phases
# 0/1/2/3/4/5 are stubbed in index.ts; cuts 18+19 implement them. The
# workflow ships now so the cron schedule + concurrency group + cache
# layout are in place when the pipeline implementation lands.
on:
  # No schedule of its own: night-shift.yml starts it on Sunday and Tuesday nights, one bot at
  # a time, after checking the Claude quota.
  workflow_dispatch:
    inputs:
      area:
        description: 'Optional: force a specific area to audit (otherwise Phase 0 picks)'
        required: false
      max_attempts:
        description: 'Generator-critic loop cap (default 5)'
        required: false
        default: '5'
      dry_run:
        description: 'Set to 1 to run without taking any action (Phase 0/1 only)'
        required: false
        default: ''

# Single-instance invariant per ADR-0011. The bot appends to a
# cached reviewer-log.jsonl; two concurrent runs would race on the
# cache. `cancel-in-progress: false` queues the second invocation;
# never kills in-flight work. Literal group name 'review-bot' is
# shared with the matching job in bots-compact.yml so the monthly
# compactor cannot run concurrently with the daily bot.
concurrency:
  group: review-bot
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 60
    permissions:
      # Read+write contents (push improve/<id> branches), read+write
      # issues (post comments + apply labels if stuck), read+write PRs
      # (open improvement PRs). Same widest-permission posture as fix-bot
      # — only writes to improve/* branches, never main.
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history needed for branch creation + git diff main...
          fetch-depth: 0

      - name: Configure git author
        run: |
          git config user.name 'review-bot'
          git config user.email 'noreply@anthropic.com'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install workspace deps
        run: npm ci

      - name: Build gazetta package
        # Some tests need the built package; build once up front.
        run: npm run build -w packages/gazetta

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      # Restore the reviewer-log from cache. The bot appends Agent B
      # verdicts on every loop iteration; the cache keeps the file
      # across runs so the monthly compactor has cross-candidate signal
      # to work with. Cache miss is fine — bot starts with empty log.
      # Bump -v1 suffix if the JSONL schema changes. The restore + save
      # pair (not the combined `actions/cache@vN`) is load-bearing: the
      # combined step skips its post-step save on a cache HIT, breaking
      # the append-write-back pattern. See #581.
      # Primary `key` uses ${{ github.run_id }} so exact-key match ALWAYS
      # misses at restore time — forcing fall-through to restore-keys.
      # The restore-keys prefix ends with '-' to disambiguate per-run
      # entries from any stale pre-#582 static blob. See #582 follow-up.
      - name: Restore reviewer-log cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bots/review-bot/reviewer-log.jsonl
          key: review-bot-reviewer-log-v1-${{ github.run_id }}
          restore-keys: |
            review-bot-reviewer-log-v1-

      - name: Run review-bot
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          # Workflow_dispatch inputs forwarded; cron runs use defaults.
          AREA: ${{ inputs.area }}
          MAX_ATTEMPTS: ${{ inputs.max_attempts || '5' }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: npm run review-bot -w @gazetta/bots

      # Save the appended reviewer-log under a per-run key. `if: always()`
      # ensures we persist verdicts even when the bot itself failed.
      # See #581.
      - name: Save reviewer-log cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bots/review-bot/reviewer-log.jsonl
          key: review-bot-reviewer-log-v1-${{ github.run_id }}

      - name: Upload transcripts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: review-bot-transcripts
          path: bots/transcripts/
          if-no-files-found: ignore
          retention-days: 90
