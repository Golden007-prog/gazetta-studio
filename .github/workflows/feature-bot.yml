name: Feature bot

# Implements feature cuts via the generator-critic loop.
#
# Picks the next unblocked cut sub-issue (`enhancement` + `ready-for-agent`,
# `**Depends on**` refs all closed) and opens one PR per cut. Three-tier
# escalation: APPROVE (PR opens), NEEDS_INPUT (needs-info label + question
# comment), NEEDS_HUMAN (ready-for-human label + sub-issue closed).
#
# Two trigger modes:
#   - Cron (daily 04:30 UTC): scans unblocked candidates per the input contract
#   - workflow_dispatch with `issue` input: attempt one specific sub-issue
#
# Bot opens PRs as DRAFT; maintainer reviews, marks ready, and merges. Bot
# never merges (per rule 33).
#
# Design: .claude/rules/design-feature-bot.md
# Concurrency invariant: ADR-0011 (single-instance via group: feature-bot)
on:
  # No schedule of its own: night-shift.yml starts it on Friday nights, one bot at
  # a time, after checking the Claude quota.
  workflow_dispatch:
    inputs:
      issue:
        description: 'Optional: attempt one specific cut sub-issue (otherwise scans unblocked candidates)'
        required: false
      max_attempts:
        description: 'Generator-critic loop cap (default 2; lower for cost-bounded testing)'
        required: false
        default: '2'
      budget_ms:
        description: 'Per-run wall-clock budget in ms (default 9000000 = 150min)'
        required: false
        default: '9000000'
      cut_budget_ms:
        description: 'Per-cut wall-clock budget in ms (default 7200000 = 120min). Must stay below the job timeout-minutes.'
        required: false
        default: '7200000'
      dry_run:
        description: 'Set to "1" to scan candidates and exit before invoking Claude'
        required: false
        default: ''

# Single-instance invariant for cache safety. The bot appends to a
# cached reviewer-log.jsonl; two concurrent runs would race on the
# cache (last-writer-wins would lose entries). `cancel-in-progress:
# false` queues the second invocation until the first completes —
# never kills in-flight work. The literal group name 'feature-bot' is
# shared with the matching job in bots-compact.yml so the monthly
# compactor cannot run concurrently with the daily bot.
concurrency:
  group: feature-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    continue-on-error: true
    # 180 min, not 60. A single Agent A invocation was measured at ~10.6 min
    # (cut #524, run 37150215338), so the old 60-min wall left no room for a
    # 2-attempt generator-critic loop at a viable per-attempt size — see the
    # SIZING note on PER_CUT_BUDGET_MS in bots/feature-bot/index.ts. Must
    # exceed the per-cut budget (120 min) so the graceful in-bot escalation
    # fires before this hard kill. Precedent: mutation.yml already uses 180.
    timeout-minutes: 180
    permissions:
      # Read CI run history (for past-PR feedback loop), read+write issues
      # (apply labels, post comments, close sub-issues), read+write PRs
      # (open cut PRs as drafts; open skip-list-entry PRs on NEEDS_HUMAN),
      # read+write contents (push cut branches). Only writes to feature
      # cut branches, never main (rule 33).
      #
      # A cut that modifies `.github/workflows/**` CANNOT be pushed by this
      # bot, and no permission here can change that. GitHub rejects the push
      # ("refusing to allow a GitHub App to create or update workflow ...
      # without `workflows` permission"), and `workflows` is not a valid
      # `permissions:` scope for `GITHUB_TOKEN` — the valid scopes are
      # actions, artifact-metadata, attestations, checks, code-quality,
      # contents, deployments, discussions, id-token, issues, packages,
      # pages, pull-requests, security-events, statuses,
      # vulnerability-alerts. Adding `workflows: write` here is a workflow
      # PARSE ERROR, which takes the whole bot offline (HTTP 422 on every
      # dispatch) — see #840.
      #
      # Consequence: cuts like #524 ("wire @storybook/test-runner into CI")
      # are structurally undeliverable by this bot. Run 37152238559 got all
      # the way to Agent B APPROVED before the push failed. Such cuts must
      # escalate to a human until #336 moves the bots to a GitHub App
      # installation token, which CAN hold the `workflows` permission that
      # `GITHUB_TOKEN` structurally lacks.
      actions: read
      issues: write
      pull-requests: write
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Need full history for branch creation + force-with-lease and
          # for capturing diffs across past-PR feedback queries.
          fetch-depth: 0

      - name: Configure git author
        run: |
          git config user.name 'feature-bot'
          git config user.email 'noreply@anthropic.com'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install workspace deps
        # Full install required because the bot runs real tests during
        # the reviewer-loop verification of each attempt. ~2 min cost
        # amortized across the run.
        run: npm ci

      - name: Build gazetta package
        # Some tests need the built package; build once up front.
        run: npm run build -w packages/gazetta

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      # Restore the reviewer-log from cache. The bot appends Agent B
      # verdicts on every loop iteration; the cache keeps the file
      # across runs so the monthly compactor has cross-issue signal
      # to work with. See bots/README.md "Reviewer-log persistence".
      # Cache miss is fine — tailReviewerLog returns [].
      #
      # Uses the restore + save split (not combined `actions/cache@vN`)
      # because the combined action skips its post-step save on a
      # cache HIT against the primary key, which breaks the append-
      # write-back pattern (see #581). Primary `key` uses ${{ github.run_id }}
      # so exact-key match ALWAYS misses at restore time — forcing
      # fall-through to restore-keys. The restore-keys prefix ends
      # with '-' to disambiguate per-run entries from any stale
      # pre-fix static blob (see #620).
      - name: Restore reviewer-log cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bots/feature-bot/reviewer-log.jsonl
          key: feature-bot-reviewer-log-v1-${{ github.run_id }}
          restore-keys: |
            feature-bot-reviewer-log-v1-

      - name: Run feature-bot
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          # Empty when input not provided — the bot treats empty as cron
          # mode (scan unblocked candidates) and treats a numeric value
          # as manual one-issue mode.
          ISSUE_NUMBER: ${{ inputs.issue }}
          # Optional overrides via workflow_dispatch inputs. The fallback
          # literals here MUST match the TypeScript defaults in
          # bots/feature-bot/index.ts — when manual dispatch provides no
          # value, GH Actions evaluates `inputs.X` to '' and the `||`
          # selects the literal.
          MAX_ATTEMPTS: ${{ inputs.max_attempts || '2' }}
          BUDGET_MS: ${{ inputs.budget_ms || '9000000' }}
          # Was previously unwired — the per-cut budget could only be changed
          # by editing the TypeScript. Wiring it keeps the three budget knobs
          # adjustable from a manual dispatch without a code change.
          CUT_BUDGET_MS: ${{ inputs.cut_budget_ms || '7200000' }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: npm run feature-bot -w @gazetta/bots

      # if: always() so we persist Agent B verdicts even when the bot
      # run itself fails — losing the log on failure would silently
      # drop verdict signal that informed the failure.
      - name: Save reviewer-log cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bots/feature-bot/reviewer-log.jsonl
          key: feature-bot-reviewer-log-v1-${{ github.run_id }}

      - name: Upload transcripts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: feature-bot-transcripts
          path: bots/transcripts/
          if-no-files-found: ignore
          retention-days: 90
