name: Mutation

# Runs Stryker mutation testing against high-stakes modules on a nightly
# schedule. Not on PRs — Stryker on the full target set takes ~hours,
# which is too slow for merge blocking.
#
# Result is the report artifact, viewable as HTML. A low mutation score
# does NOT fail the run (continue-on-error on the Stryker step): the
# score is signal, not gate. When the baseline stabilises, consider
# raising stryker.config.json's `thresholds.break` to enforce a floor.
# A run that writes no report does fail, so a broken run shows (#1475).
on:
  schedule:
    # 03:00 UTC nightly. Off-hours for most contributors.
    - cron: '0 3 * * *'
  workflow_dispatch:
    # Manual trigger — for running against a branch before merging a
    # big change to the targeted modules.

permissions:
  contents: read

jobs:
  stryker:
    runs-on: ubuntu-latest
    # The full mutant set (about 5,500 mutants) needs about 225 minutes on
    # ubuntu-latest; at 180 every run from 2026-10-26 was cancelled at 77%.
    # GitHub's job limit is 360.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w packages/gazetta
      - name: Run Stryker
        # Stryker exits non-zero when the score breaks the threshold; that
        # still writes a report, so it mustn't fail the run. The check at
        # the end fails it when no report was written (#1475).
        continue-on-error: true
        working-directory: packages/gazetta
        run: npm run test:mutation
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report
          path: packages/gazetta/reports/mutation
          retention-days: 30
      - name: Fail when Stryker wrote no report
        run: |
          if [ ! -f packages/gazetta/reports/mutation/mutation.html ]; then
            echo "::error::Stryker wrote no report; see the Run Stryker step."
            exit 1
          fi
