name: Fix bot

# Attempts to fix `bug + ready-for-agent` issues. Two trigger modes:
#   - Cron (daily): scans candidates per the input contract
#   - workflow_dispatch with `issue` input: fix one specific issue
#
# Output: PR (or stuck-comment + ready-for-human label). Bot opens the
# PR as DRAFT; maintainer reviews, marks ready, and merges. Bot never
# merges (per rule 33).
#
# TDD-first hard contract: bot's first commit MUST be a failing test or
# it stops. See bots/fix-bot/prompt.md.
on:
  # No schedule of its own: night-shift.yml starts it every night, after
  # feature-bot, one bot at a time, after checking the Claude usage.
  workflow_dispatch:
    inputs:
      issue:
        description: 'Optional: fix one specific issue (otherwise scans all candidates)'
        required: false
      max_attempts:
        description: 'Generator-critic loop cap (default 3; lower for cost-bounded testing)'
        required: false
        default: '3'
      budget_ms:
        description: 'Per-run wall-clock budget in ms (default 3000000 = 50min)'
        required: false
        default: '3000000'

# Single-instance invariant for cache safety. The bot appends to a
# cached reviewer-log.jsonl; two concurrent runs would race on the
# cache (last-writer-wins would lose entries). `cancel-in-progress:
# false` queues the second invocation until the first completes —
# never kills in-flight work. The literal group name 'fix-bot' is
# shared with the matching job in bots-compact.yml so the monthly
# compactor cannot run concurrently with the daily bot.
concurrency:
  group: fix-bot
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    continue-on-error: true
    # The 50-min BUDGET_MS is checked only between issues, never during a
    # Claude call, so one issue started near the end of the budget runs to
    # completion. Flake fixes prove durability with 5-10x e2e repeats
    # (team-preferences rule 35): an Agent A call on #886 ran past 55 min
    # and the 60-min limit killed it (2026-10-11). 50 + ~55 + setup ~= 110.
    timeout-minutes: 120
    permissions:
      # Read+write contents (push fix branches), read+write issues
      # (post comments + apply ready-for-human), read+write PRs (open
      # draft PRs). The widest permission set of any bot — but only
      # writes to fix/issue-NNN branches, never main (rule 33).
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Need full history for branch creation + force-with-lease.
          fetch-depth: 0

      - name: Configure git author
        run: |
          git config user.name 'fix-bot'
          git config user.email 'noreply@anthropic.com'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install workspace deps
        # Full install required because the bot runs real tests during
        # both the failing-test verification and the post-fix regression
        # check. ~2 min cost amortized across the run.
        run: npm ci

      - name: Build gazetta package
        # Some tests need the built package; build once up front.
        run: npm run build -w packages/gazetta

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@stable

      # Restore the reviewer-log from cache. The bot appends Agent B
      # verdicts on every loop iteration; the cache keeps the file
      # across runs so the monthly compactor has cross-issue signal
      # to work with. See bots/README.md "Reviewer-log persistence".
      # Cache miss is fine — tailReviewerLog returns []. Bump the
      # -v1 suffix if the JSONL schema ever changes. The restore + save
      # pair (not the combined `actions/cache@vN`) is load-bearing: the
      # combined step skips its post-step save on a cache HIT against
      # the primary key, which breaks the append-write-back pattern
      # (every run after the first reads N entries, appends 1, but
      # never persists the new entry). The split pattern with a
      # per-run save key sidesteps the trap — every run produces its
      # own immutable cache entry; restore matches via `restore-keys`
      # prefix. See #581 and ADR-0011.
      # Primary `key` uses ${{ github.run_id }} so exact-key match ALWAYS
      # misses at restore time — forcing fall-through to restore-keys.
      # The restore-keys prefix ends with '-' to disambiguate per-run
      # entries from any stale pre-#582 static blob. See #582 follow-up.
      - name: Restore reviewer-log cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bots/fix-bot/reviewer-log.jsonl
          key: fix-bot-reviewer-log-v1-${{ github.run_id }}
          restore-keys: |
            fix-bot-reviewer-log-v1-

      - name: Run fix bot
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          # Empty when input not provided — the bot treats empty as cron
          # mode (scan candidates) and treats a numeric value as manual
          # one-issue mode.
          ISSUE_NUMBER: ${{ inputs.issue }}
          # Optional overrides via workflow_dispatch inputs. Cron runs
          # use the orchestrator's defaults (`||` fallback below passes
          # the same defaults the TS code defines).
          MAX_ATTEMPTS: ${{ inputs.max_attempts || '3' }}
          BUDGET_MS: ${{ inputs.budget_ms || '3000000' }}
        run: npm run fix-bot -w @gazetta/bots

      # Save the appended reviewer-log under a per-run key. The restore
      # step uses prefix match (`restore-keys`) to find the latest write
      # on the next run. `if: always()` ensures we persist verdicts even
      # when the bot itself failed — losing those would erase the signal
      # that informed the failure.
      - name: Save reviewer-log cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bots/fix-bot/reviewer-log.jsonl
          key: fix-bot-reviewer-log-v1-${{ github.run_id }}

      - name: Upload transcripts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fix-bot-transcripts
          path: bots/transcripts/
          if-no-files-found: ignore
          retention-days: 90
