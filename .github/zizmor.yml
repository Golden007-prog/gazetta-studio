# zizmor config. Run with `npm run lint:actions:security`; CI runs it in
# .github/workflows/zizmor.yml.
rules:
  # The bots install the Claude Code CLI from its `stable` dist-tag:
  # about a week old and regression-filtered by Anthropic, so a freshly
  # published bad release never reaches them. zizmor flags any install
  # outside a lockfile, even an exact version; the lockfile route would
  # put the CLI's ~286 MB platform binary into every `npm ci`.
  adhoc-packages:
    disable: true

  # These bots push branches and open PRs with git, so their checkout
  # must keep its token.
  artipacked:
    ignore:
      - bots-compact.yml
      - dead-code-watcher.yml
      - feature-bot.yml
      - fix-bot.yml
      - mutation-area-picker.yml
      - review-bot.yml

  # workflow_run on Mutation, which runs only on schedule and manual
  # dispatch on main, never on PR code.
  dangerous-triggers:
    ignore:
      - mutation-watcher.yml
      # issue_comment: the job's `if:` only lets OWNER/MEMBER/COLLABORATOR
      # comments through (author_association), so outsiders can't start it.
      - review-on-comment.yml
      # issue_comment: the same author_association check. On a comment the
      # job checks out main, so a fork PR's files never set the prompt.
      - gemini-review.yml
