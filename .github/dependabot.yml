version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # Bundle safe updates (patch + minor) into one PR per group. Majors get
      # their own PR each so they can be reviewed/upgraded individually —
      # bundling 5+ major bumps (#118) produced an unmergeable mess.
      production:
        patterns: ["*"]
        # 0.x packages are excluded so each gets its own PR. Dependabot treats
        # every version as major.minor.patch, so 0.34 -> 0.35 counts as a
        # "minor" bump and would land in this group — but under semver a 0.x
        # minor is breaking. #866 bundled all three below with 43 safe updates.
        # Add any new 0.x dependency here.
        exclude-patterns:
          - "@types/*"
          - "@anthropic-ai/sdk"
          - "@formkit/drag-and-drop" # pinned exactly; bump only after reading the changelog (design-component-ordering.md)
          - "sharp"
        update-types: ["patch", "minor"]
      types:
        patterns: ["@types/*"]
        update-types: ["patch", "minor"]
    # PrimeUI moved to a proprietary licence ("PrimeUI License", licence key
    # required) in @primeuix/themes 3, @primeuix/styled 1 and PrimeVue 5.
    # Stay on the MIT lines (#1519).
    ignore:
      - dependency-name: "@primeuix/themes"
        versions: [">=3"]
      - dependency-name: "@primeuix/styled"
        versions: [">=1"]
      - dependency-name: "primevue"
        versions: [">=5"]
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Actions are pinned to commit SHAs (zizmor unpinned-uses); one weekly
    # PR bumps every SHA and its `# vX.Y.Z` comment together.
    groups:
      github-actions:
        patterns: ["*"]
    open-pull-requests-limit: 3
