<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gazetta CMS</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%238b5cf6'/%3E%3Crect x='7' y='7' width='8' height='8' rx='2' fill='white'/%3E%3Crect x='17' y='7' width='8' height='8' rx='2' fill='white' opacity='.6'/%3E%3Crect x='7' y='17' width='8' height='8' rx='2' fill='white' opacity='.6'/%3E%3Crect x='17' y='17' width='8' height='8' rx='2' fill='white' opacity='.3'/%3E%3C/svg%3E">
</head>
<body>
  <div id="browser-too-old" style="display:none;font-family:system-ui,sans-serif;padding:2rem;line-height:1.5">
    This browser is too old for the Gazetta admin. Use Chrome or Edge 111+, Firefox 114+ or Safari 16.4+.
  </div>
  <script>
    // ES5 by design: this must parse and run in browsers too old for the
    // bundle. Every probe below passes on each supported browser
    // (Chrome/Edge 111+, Firefox 114+, Safari 16.4+):
    //   structuredClone          Chrome 98  / Firefox 94  / Safari 15.4
    //   Array.prototype.findLast Chrome 97  / Firefox 104 / Safari 15.4
    //   AbortSignal.timeout      Chrome 103 / Firefox 100 / Safari 16.0
    //   CSS lab() color          Chrome 111 / Firefox 113 / Safari 15.4
    //   HTMLElement inert        Chrome 102 / Firefox 112 / Safari 15.5
    //   importmap support        Chrome 89  / Firefox 108 / Safari 16.4
    // Chrome and Safari are probed at their exact minimum versions (lab()
    // at Chrome 111, importmap at Safari 16.4); Firefox 114 shipped nothing
    // a probe can detect, so its effective probe floor is 113. No probe uses
    // eval or new Function, so a strict Content-Security-Policy cannot
    // false-trigger the message; if CSP blocks inline scripts entirely the
    // check simply never runs and the bundle is unaffected. This is still
    // graceful degradation, not a hard version gate: a browser one step
    // below the floor can pass every probe and runs whatever the bundle
    // gives it.
    (function () {
      var ok =
        typeof window.structuredClone === 'function' &&
        typeof Array.prototype.findLast === 'function' &&
        typeof window.AbortSignal === 'function' &&
        typeof window.AbortSignal.timeout === 'function' &&
        typeof window.HTMLElement === 'function' &&
        'inert' in window.HTMLElement.prototype &&
        typeof window.HTMLScriptElement === 'function' &&
        typeof window.HTMLScriptElement.supports === 'function' &&
        window.HTMLScriptElement.supports('importmap') &&
        typeof window.CSS !== 'undefined' &&
        typeof window.CSS.supports === 'function' &&
        window.CSS.supports('color', 'lab(50% 40 60)');
      if (!ok) {
        var el = document.getElementById('browser-too-old');
        if (el) el.style.display = 'block';
      }
    })();
  </script>
  <script nomodule>
    // Runs only where ES modules are unsupported at all.
    document.getElementById('browser-too-old').style.display = 'block';
  </script>
  <div id="app"></div>
  <script type="module" src="/src/client/main.ts"></script>
</body>
</html>
